[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tse-session-ranker"
version = "0.3.0"
description = "Profit-first, leakage-safe pre-open ranking for Tokyo Stock Exchange sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
parquet = ["pyarrow>=14"]

[project.scripts]
tse-session-ranker = "tse_session_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
